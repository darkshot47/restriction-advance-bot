plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vmore.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vmore.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "Vmore"
        ndk {
            //: TDLib direct mode ships one libtdjni.so per ABI (built by
            //: android/tdlib/build.sh in CI).  The two real-world phone ABIs
            //: keep the APK lean; emulators simply use the server path.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            //: Signed with the debug key so every CI build is installable
            //: without shipping a private keystore to GitHub.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    //: JVM unit tests for the pure helpers (URLs, file kinds).  Nothing else —
    //: the app itself has no runtime dependency.
    testImplementation 'junit:junit:4.13.2'
}
