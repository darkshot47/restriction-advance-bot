plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vmore.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vmore.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        resValue "string", "app_name", "Vmore"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            //: Signed with the debug key so every CI build is installable
            //: without shipping a private keystore to GitHub.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}
