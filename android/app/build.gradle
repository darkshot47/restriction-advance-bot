plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vmore.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.vmore.app"
        minSdk 26
        targetSdk 34
        versionCode 7
        versionName "2.2.3"
        resValue "string", "app_name", "Vmore"
        ndk {
            //: TDLib direct mode ships one libtdjni.so per ABI (built by
            //: android/tdlib/build.sh in CI).  The two real-world phone ABIs
            //: keep the APK lean; emulators simply use the server path.
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    //: The update key.
    //:
    //: Android only installs an APK over an existing app when both are signed
    //: with the same key.  Signing every build with the *debug* key looked
    //: convenient, but a debug keystore is generated fresh on each CI runner —
    //: so every release was signed with a different key and every update ended
    //: in "App not installed".
    //:
    //: The release build is therefore signed with one keystore that lives in
    //: the repository itself, under android/signing/, and the workflow exports
    //: it here (the password file sits next to it).  A secret cannot be used:
    //: the workflow has to read the key on every run, and a value only the
    //: owner can see cannot be read by a runner.  The key is therefore public
    //: by design — see android/signing/README.md for what that trades away and
    //: how to rotate it.
    def updateKeystore = System.getenv('VMORE_STORE_FILE')
    if (updateKeystore != null && !updateKeystore.isEmpty()) {
        signingConfigs {
            update {
                storeFile file(updateKeystore)
                storePassword System.getenv('VMORE_STORE_PASSWORD')
                keyAlias System.getenv('VMORE_KEY_ALIAS')
                keyPassword System.getenv('VMORE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            //: The stable key when the workflow provides it, the debug key when
            //: someone builds by hand — a local build still has to work.
            signingConfig updateKeystore != null && !updateKeystore.isEmpty()
                    ? signingConfigs.update : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packagingOptions {
        resources.excludes += ['META-INF/*']
    }
}

dependencies {
    //: JVM unit tests for the pure helpers (URLs, file kinds).  Nothing else —
    //: the app itself has no runtime dependency.
    testImplementation 'junit:junit:4.13.2'
}
