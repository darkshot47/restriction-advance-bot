name: android

# Builds the Vmore app, packs the APK into a zip and publishes it twice:
#   • as a workflow artifact (every build), and
#   • as a GitHub Release asset — the stable link the bot's "Unlimited Download"
#     button points at (the owner copies that link into /apk's caption).
#
# The zip is what the owner asked for: "build the app and extract the APK from a
# zip file".  Both files are verified (unzip -t + aapt2 badging) before release.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Server address baked into the app as the starting value (optional)"
        required: false
        default: ""
      release_tag:
        description: "Release tag to publish (default: vmore-latest)"
        required: false
        default: "vmore-latest"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "::error::no Android SDK found on the runner"
            exit 1
          fi
          echo "ANDROID SDK: $SDK"
          ls "$SDK" || true
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -20
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          ls "$SDK/platforms"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          #: The project ships no wrapper jar (it is a binary), so the action
          #: installs this exact Gradle — the version AGP 8.5 wants.
          gradle-version: "8.7"

      - name: Point the app at the owner's server (optional)
        if: ${{ inputs.base_url != '' }}
        working-directory: android
        run: |
          #: The address stays editable in the app; this only pre-fills it so a
          #: fresh install already knows the deployment.
          python3 - "${{ inputs.base_url }}" <<'PY'
          import pathlib, sys
          url = sys.argv[1].strip().rstrip("/")
          if not url.startswith(("http://", "https://")):
              url = "https://" + url
          path = pathlib.Path("app/src/main/res/values/strings.xml")
          text = path.read_text(encoding="utf-8")
          start = text.index('<string name="default_base_url"')
          end = text.index("</string>", start) + len("</string>")
          text = text[:start] + f'<string name="default_base_url" translatable="false">{url}</string>' + text[end:]
          path.write_text(text, encoding="utf-8")
          print("baked base url:", url)
          PY

      - name: Build the debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug --stacktrace 2>&1 | tee ../build.log
          tail -5 ../build.log

      - name: Pack it the way the owner wants it (zip → APK)
        working-directory: android
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Vmore.apk
          cd dist
          zip -9 Vmore-apk.zip Vmore.apk
          unzip -t Vmore-apk.zip
          #: Prove the APK inside the zip is a real, installable package.
          AAPT2="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | head -1)"
          if [ -n "$AAPT2" ]; then "$AAPT2" dump badging Vmore.apk | head -5; fi
          sha256sum Vmore.apk Vmore-apk.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -lh

      - name: Upload the zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vmore-apk
          path: |
            android/dist/Vmore-apk.zip
            android/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the release (stable download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'vmore-latest' }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" \
            android/dist/Vmore.apk \
            android/dist/Vmore-apk.zip \
            android/dist/SHA256SUMS.txt \
            --title "Vmore APK (latest)" \
            --notes "Automated build of the Vmore Android app.

          **Install**
          1. Download \`Vmore.apk\` (or \`Vmore-apk.zip\` and unzip it).
          2. Open it on the phone and allow \"Install unknown apps\" once.
          3. Enter the server address and your access token (send /gentoken to the bot).

          The bot's **♾️ Unlimited Download (App)** button points at this release, so this link stays valid." \
            --latest

      - name: What went wrong (job summary)
        if: failure()
        run: |
          {
            echo "## ❌ android build failed"
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "no build log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
