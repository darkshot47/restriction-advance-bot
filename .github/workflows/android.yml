name: android

# Builds the Vmore app, packs the APK into a zip and publishes it twice:
#   • as a workflow artifact (every build), and
#   • as a GitHub Release asset — the stable download link users install from.
#
# The app is fully standalone: it signs in with the phone's own Telegram account
# and talks to Telegram directly (TDLib), so no server address, token or api
# credential is baked into the build.
#
# The zip is what the owner asked for: "build the app and extract the APK from a
# zip file".  Both files are verified (unzip -t + aapt2 badging) before release.

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish (default: vmore-latest)"
        required: false
        default: "vmore-latest"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          set -o pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ]; then
            echo "::error::no Android SDK found on the runner"
            exit 1
          fi
          echo "ANDROID SDK: $SDK"
          ls "$SDK" || true
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" 2>&1 | tail -20
          #: TDLib's Android build wants exactly these two (see android/tdlib/build.sh).
          "$SDKMANAGER" "ndk;23.2.8568313" "cmake;3.22.1" 2>&1 | tail -6
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          ls "$SDK/platforms"

      - name: Check the Android sources
        #: The same check the tests job runs, so a resource that aapt2 would
        #: refuse does not wait for the TDLib build to be reported.
        run: |
          python -m pip install -q javalang
          cd android/app/src/main
          python3 ../../../tools/check_sources.py

      - name: TDLib host prerequisites (the code generator's toolchain)
        run: |
          #: Steps with `| tail`/`| tee` need pipefail, or a failing apt/sdkmanager
          #: is hidden behind the pipe. (GitHub's default `bash -e` does not set it.)
          set -o pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gperf ninja-build 2>&1 | tail -3
          gperf --version | head -1

      - name: Cache the heavy TDLib / OpenSSL build (only the pinned commit rebuilds)
        uses: actions/cache@v4
        with:
          path: |
            android/tdlib/td
            android/tdlib/third-party
          #: Any change to the pinned commit or to the build recipe fully regenerates.
          key: tdlib-${{ hashFiles('android/tdlib/TDLIB_COMMIT', 'android/tdlib/build.sh') }}

      - name: Build TDLib (Java bindings + libtdjni.so for both phone ABIs)
        run: |
          #: Without pipefail the step's status is tee's, so a failed build.sh
          #: would be reported as success here and only fail later, obscurely.
          set -o pipefail
          bash android/tdlib/build.sh "$ANDROID_SDK_ROOT" 2>&1 | tee tdlib-build.log
          #: The result the app actually ships — assert it loudly.
          ls -lh android/app/src/main/jniLibs/*/libtdjni.so
          ls -lh android/app/src/main/java/org/drinkless/tdlib/

      - name: Surface the TDLib build error (job annotations)
        if: failure()
        run: |
          #: Same idea as the APK step: the raw log is not always readable, so
          #: the compiler/linker/download lines are re-emitted as annotations.
          (grep -aE "error|Error|ERROR|failed|FAILED|undefined reference|No such file|fatal|Caused by|not found|Permission denied|exit code|Killed" \
              tdlib-build.log 2>/dev/null || true) | tr -d "\r" | tail -60 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-900)"
          done
          echo "--- last 60 lines of the TDLib build log ---"
          tail -n 60 tdlib-build.log 2>/dev/null || echo "no tdlib-build.log"

      - name: Upload the TDLib build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tdlib-build-log
          path: tdlib-build.log
          if-no-files-found: warn

      - name: The update signing key (stable across builds)
        #: Android refuses to install an APK over an app signed with a different
        #: key ("App not installed").  A debug keystore is regenerated on every
        #: runner, which is exactly why updates used to fail, so the release key
        #: is kept in a draft release of this repository — drafts are visible to
        #: the owner only — and exported to Gradle here.  When it cannot be
        #: reached (a pull request from a fork, for instance) the build falls
        #: back to the debug key instead of failing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          KEYRING="vmore-signing-key"
          HOME_DIR="$HOME/.vmore"
          KEYSTORE="$HOME_DIR/vmore.jks"
          mkdir -p "$HOME_DIR"

          read_keyring() {
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$KEYRING" --jq '.body' 2>/dev/null
          }

          if BODY="$(read_keyring)" && [ -n "$BODY" ] \
              && gh release download "$KEYRING" -p vmore.jks --clobber -O "$KEYSTORE" 2>/dev/null; then
            echo "::notice::update key restored from the $KEYRING draft release"
          else
            echo "no keyring yet: creating one"
            PASSWORD="$(openssl rand -hex 24)"
            if keytool -genkeypair -v -keystore "$KEYSTORE" -alias vmore \
                -keyalg RSA -keysize 4096 -validity 10950 -storetype PKCS12 \
                -storepass "$PASSWORD" -keypass "$PASSWORD" \
                -dname "CN=Vmore, O=Vmore, C=IN" 2>&1 | tail -3; then
              BODY="storePassword=$PASSWORD
          keyAlias=vmore

          The Android update key of this app. Android only accepts an update that
          is signed with the same key as the installed app, so this release must
          never be published and never be deleted: doing either would leave every
          installed copy of Vmore unable to update itself."
              gh release create "$KEYRING" --draft --title "Vmore signing key (do not publish, do not delete)" --notes "$BODY" 2>&1 | tail -2 || true
              gh release upload "$KEYRING" "$KEYSTORE" --clobber 2>&1 | tail -2 || true
              echo "::warning::a new update key was created; installed apps must be uninstalled once before they can take an update"
            else
              echo "::warning::the update key could not be created; falling back to the debug key"
              BODY=""
            fi
          fi

          if [ -n "${BODY:-}" ] && [ -f "$KEYSTORE" ]; then
            PASSWORD="$(printf '%s\n' "$BODY" | grep -m1 '^storePassword=' | cut -d= -f2-)"
            ALIAS="$(printf '%s\n' "$BODY" | grep -m1 '^keyAlias=' | cut -d= -f2-)"
            ALIAS="${ALIAS:-vmore}"
            if keytool -list -keystore "$KEYSTORE" -storepass "$PASSWORD" -alias "$ALIAS" >/dev/null 2>&1; then
              FINGERPRINT="$(keytool -list -v -keystore "$KEYSTORE" -storepass "$PASSWORD" -alias "$ALIAS" \
                | grep -m1 'SHA256:' | sed 's/.*SHA256: //')"
              echo "VMORE_STORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
              echo "VMORE_STORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
              echo "VMORE_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
              echo "VMORE_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
              echo "VMORE_FINGERPRINT=$FINGERPRINT" >> "$GITHUB_ENV"
              echo "::notice::signing with the stable update key, certificate SHA256 $FINGERPRINT"
            else
              echo "::warning::the update key could not be read; falling back to the debug key"
            fi
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          #: The project ships no wrapper jar (it is a binary), so the action
          #: installs this exact Gradle — the version AGP 8.5 wants.
          gradle-version: "8.7"

      - name: Build the APK (and run its unit tests)
        working-directory: android
        run: |
          set -o pipefail
          #: assembleRelease: the file people install is a real release build,
          #: signed with the update key so the next build installs over it.
          gradle --no-daemon testDebugUnitTest assembleRelease --stacktrace 2>&1 | tee ../build.log
          tail -5 ../build.log

      - name: Report the app's unit tests
        working-directory: android
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET

          total = failures = errors = 0
          for report in glob.glob("app/build/test-results/testDebugUnitTest/*.xml"):
              root = ET.parse(report).getroot()
              total += int(root.get("tests", 0))
              failures += int(root.get("failures", 0))
              errors += int(root.get("errors", 0))
          print(f"::notice::Vmore unit tests: {total} run, {failures} failed, {errors} errors")
          if total == 0:
              print("::error::the app's unit tests did not run")
              raise SystemExit(1)
          raise SystemExit(1 if (failures or errors) else 0)
          PY

      - name: Pack it the way the owner wants it (zip → APK)
        working-directory: android
        run: |
          set -o pipefail
          mkdir -p dist
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            #: Only reachable before the first release build existed; a debug
            #: APK is better than no download link.
            APK=app/build/outputs/apk/debug/app-debug.apk
            echo "::warning::no release APK was produced; packing the debug one"
          fi
          cp "$APK" dist/Vmore.apk
          cd dist
          #: The signature is the thing Android judges an update by, so it is
          #: checked here and printed: every future build must show the same
          #: certificate, or phones will refuse to install over the old app.
          APKSIGNER="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | head -1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs Vmore.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || true
            ACTUAL="$("$APKSIGNER" verify --print-certs Vmore.apk \
              | sed -n 's/.*certificate SHA-256 digest: //p' | head -1 \
              | tr 'A-F' 'a-f' | tr -d ':')"
            EXPECTED_FILE="../tools/expected_signing.txt"
            if [ -s "$EXPECTED_FILE" ]; then
              EXPECTED="$(tr -d '[:space:]:' < "$EXPECTED_FILE" | tr 'A-F' 'a-f')"
              if [ "$ACTUAL" != "$EXPECTED" ]; then
                echo "::error::this APK is signed with a different key than the recorded one"
                echo "::error::expected $EXPECTED"
                echo "::error::actual   $ACTUAL"
                echo "::error::Android will refuse to update an installed Vmore with it. Restore the vmore-signing-key draft release, or update android/tools/expected_signing.txt on purpose."
                exit 1
              fi
              echo "::notice::signature matches the recorded update key ($ACTUAL)"
            else
              echo "::notice::recorded update key: $ACTUAL — write it into android/tools/expected_signing.txt to catch a key change in future builds"
            fi
          fi
          zip -9 Vmore-apk.zip Vmore.apk
          unzip -t Vmore-apk.zip
          #: Prove the APK inside the zip is a real, installable package.
          AAPT2="$(ls "$ANDROID_SDK_ROOT"/build-tools/*/aapt2 2>/dev/null | head -1)"
          if [ -z "$AAPT2" ]; then
            echo "::error::aapt2 not found — cannot verify the APK"
            exit 1
          fi
          "$AAPT2" dump badging Vmore.apk > badging.txt
          grep -E "^(package|application-label|launchable-activity|sdkVersion|targetSdkVersion|uses-permission)" badging.txt | head -20
          #: The APK must really be Vmore, installable, and start on its login screen.
          grep -q "package: name='com.vmore.app'" badging.txt
          grep -q "launchable-activity: name='com.vmore.app.LoginActivity'" badging.txt
          grep -q "sdkVersion:'26'" badging.txt
          grep -q "application-label:'Vmore'" badging.txt
          #: Direct mode must really be inside: one libtdjni.so per phone ABI.
          unzip -l Vmore.apk | grep -q "lib/arm64-v8a/libtdjni.so"
          unzip -l Vmore.apk | grep -q "lib/armeabi-v7a/libtdjni.so"
          echo "::notice::TDLib libs inside APK: $(unzip -l Vmore.apk | grep libtdjni | awk '{print $1, $4}')"
          while IFS= read -r line; do
            echo "::notice::$(printf '%s' "$line" | cut -c1-900)"
          done < <(grep -E "^(package|application-label:|launchable-activity:|sdkVersion|targetSdkVersion)" badging.txt)
          VERSION_NAME="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -1)"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -1)"
          echo "::notice::this build is Vmore $VERSION_NAME (versionCode $VERSION_CODE)"
          #: A copy under its own version number: the stable link below always
          #: serves the newest build, and this one lets anyone see at a glance
          #: which build they actually hold.
          if [ -n "$VERSION_NAME" ]; then
            cp Vmore.apk "Vmore-$VERSION_NAME.apk"
          fi
          sha256sum Vmore.apk Vmore-apk.zip > SHA256SUMS.txt
          sha256sum "Vmore-$VERSION_NAME.apk" >> SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "$VERSION_NAME" > version.txt
          echo "$VERSION_CODE" > versioncode.txt
          ls -lh

      - name: Upload the zip (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: vmore-apk
          path: |
            android/dist/Vmore-apk.zip
            android/dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish the release (stable download link)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || 'vmore-latest' }}
        run: |
          #: pipefail: the group pipes into tee, so without it a failed
          #: `gh release upload` would be silently reported as a green publish.
          set -o pipefail
          {
            VERSION_NAME="$(cat android/dist/version.txt 2>/dev/null || echo unknown)"
            VERSION_CODE="$(cat android/dist/versioncode.txt 2>/dev/null || echo unknown)"
            {
              echo "Automated build of the Vmore Android app."
              echo
              echo "**This build**"
              echo
              echo "- Vmore ${VERSION_NAME} (versionCode ${VERSION_CODE})"
              echo "- Signed with: ${VMORE_FINGERPRINT:-the debug key (no stable key was reachable in this run)}"
              echo
              cat <<'NOTES'
          **Install**
          1. Download `Vmore.apk` (or the same file under its version number,
             or `Vmore-apk.zip` and unzip it).
          2. Open it on the phone and allow "Install unknown apps" once.
          3. If the phone says "App not installed", the installed Vmore was
             signed with an older, per-build key: uninstall it once, then
             install this. From this build on, every update installs over the
             previous one.
          4. Sign in with your phone number and the code, or with your own
             api_id and api_hash from my.telegram.org.

          Everything runs on the phone: links are downloaded and uploaded with
          your own Telegram account, and the local copy is deleted right after a
          successful upload.

          `Vmore.apk` is replaced with every build, so the stable link never
          rots; the version-named copy is what tells two builds apart.
          NOTES
            } > release-notes.md
            head -8 release-notes.md
            #: Deleting and recreating the release would briefly break the stable
            #: link (and race the tag); replacing the assets in place cannot.
            #: The stable names plus a copy named after the version, so the
            #: owner can tell which build he is holding.
            ASSETS="android/dist/Vmore.apk android/dist/Vmore-apk.zip android/dist/SHA256SUMS.txt"
            VERSION_NAME="$(cat android/dist/version.txt 2>/dev/null || true)"
            if [ -n "$VERSION_NAME" ] && [ -f "android/dist/Vmore-$VERSION_NAME.apk" ]; then
              ASSETS="$ASSETS android/dist/Vmore-$VERSION_NAME.apk"
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" $ASSETS --clobber
              gh release edit "$TAG" --title "Vmore APK (latest)" --notes-file release-notes.md \
                --latest
            else
              gh release create "$TAG" $ASSETS --title "Vmore APK (latest)" \
                --notes-file release-notes.md --latest
            fi
          } 2>&1 | tee release.log
          echo "::notice::release $TAG now serves Vmore.apk $(cat android/dist/SHA256SUMS.txt | head -1)"

      - name: What went wrong (job summary)
        if: failure()
        run: |
          {
            echo "## ❌ android build failed"
            echo '```'
            tail -n 120 build.log 2>/dev/null || echo "no build log"
            echo "--- release ---"
            tail -n 40 release.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          #: Raw logs live behind a URL this setup cannot always read, but
          #: annotations are on the API — so the real compiler errors are
          #: re-emitted as annotations, message intact.
          (grep -aA 4 -E "^\.java|error:|Error:|could not|Cannot|Validation Failed|failed to|Execution failed for task|Could not resolve|Caused by:" \
              build.log release.log 2>/dev/null || true) | tr -d "\r" | head -80 | while IFS= read -r line; do
              echo "::error::$(printf '%s' "$line" | tr -d '\r' | cut -c1-900)"
            done
