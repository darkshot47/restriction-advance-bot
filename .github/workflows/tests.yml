name: tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Byte-compile the bot
        run: python -m compileall -q main.py database.py ui.py config.py engines.py telemetry.py

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -v --color=no 2>&1 | tee pytest.log

      - name: Report failures as annotations
        if: failure()
        run: |
          #: Ordinary logs live behind a URL CI tooling cannot always read; the
          #: annotations API is always reachable, so the failing tests are
          #: re-emitted there with their short traceback.
          (grep -aE "^(FAILED|ERROR) " pytest.log || true) | head -40 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-900)"
          done
          (grep -aB 1 -A 6 "^E  *AssertionError\|^E  *[A-Za-z]*Error" pytest.log || true) | tr -d '\r' | head -60 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-900)"
          done
          {
            echo "## ❌ pytest failed"
            echo '```'
            (grep -aE "^(FAILED|ERROR) " pytest.log | head -40 || true)
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
